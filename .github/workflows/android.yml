name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Android Gradle Plugin 8.2 needs JDK 17 — 21 will fail the build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy web assets into the native project
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: rename
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/bulk-clock-${GITHUB_RUN_NUMBER}.apk"
          echo "path=out/bulk-clock-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_OUTPUT"
          echo "name=bulk-clock-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulk-clock-apk
          path: ${{ steps.rename.outputs.path }}
          retention-days: 90

      # A release asset is a plain download link, which is what you want on a phone —
      # workflow artifacts arrive as a zip and need you to be signed in.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.rename.outputs.path }}" \
            --title "Bulk Clock — build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK, built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA:0:7}.

          Download the .apk below on your phone and open it. Android will ask you to allow
          installing from this source the first time." \
            --prerelease
